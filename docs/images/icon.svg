<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Wake</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="wake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- The wake: two trails that spread behind the boat, like branches behind a commit. -->
  <path d="M44 176 C 96 170, 140 150, 196 104" fill="none" stroke="url(#wake)" stroke-width="14" stroke-linecap="round"/>
  <path d="M44 120 C 96 126, 140 128, 196 104" fill="none" stroke="url(#wake)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="196" cy="104" r="22" fill="#7cc4ff"/>
  <circle cx="196" cy="104" r="9" fill="#0b1222"/>
  <circle cx="44" cy="176" r="12" fill="#3fb950"/>
  <circle cx="44" cy="120" r="12" fill="#a371f7"/>
</svg>
